name: Validate PR 9445 Ruff style on public fork
on:
  push:
    branches:
      - ci/verify-9445-typing-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  style-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Verify the corrected PR head is in the branch history
        run: git merge-base --is-ancestor 64645bfcf586abe17b03babfd34c51bc4b23ba3e HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.17.0'
      - name: Lint and verify formatting
        run: |
          ruff check python/packages/core/agent_framework/security.py python/packages/core/tests/test_security.py
          ruff format --check python/packages/core/agent_framework/security.py python/packages/core/tests/test_security.py
